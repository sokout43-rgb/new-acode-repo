<!-- ============ login.html ============ -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<div class="container">
  <div class="card" id="loginPage">
    <div class="icon-circle">🔐</div>
    <h2>ورود به حساب</h2>
    <p class="subtitle">برای ادامه وارد شوید</p>

    <div class="message" id="loginMsg"></div>

    <form id="loginForm">
      <div class="input-group">
        <input type="text" id="loginUser" placeholder="نام کاربری" autocomplete="username" required>
        <span class="icon">👤</span>
      </div>
      <div class="input-group">
        <input type="password" id="loginPass" placeholder="رمز عبور" autocomplete="current-password" required>
        <span class="icon">🔒</span>
        <button type="button" class="toggle-pass" onclick="togglePassword('loginPass', this)">👁️</button>
      </div>
      <button type="submit" class="btn">ورود</button>
    </form>

    <div class="divider">یا</div>
    <p class="switch-text">حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
